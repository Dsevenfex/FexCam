<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body,
      html {
        width: 100%;
        height: 100%;
        font-family: sans-serif;
        background-color: #f5f5f5;
        overflow: hidden; 
      }

      
      #video {
        opacity: 0.01;
        width: 1px;
        height: 1px;
        position: absolute;
      }
      #canvas {
        display: none;
      }

      
      header {
        background-color: rgb(0, 0, 0);
        height: 55px;
        width: 100%;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 10;
      }
      header h1 {
        font-size: 18px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      
      .main-wrapper {
        width: 100%;
        height: 100%;
        padding-top: 55px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      
      .content-container {
        position: relative;
        width: 90%; 
        max-width: 500px;
        height: 60vh;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      }

    
      .blurred-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: blur(15px);
        transition: filter 0.5s ease;
        display: block;
      }

      
      .view-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 14px 28px;
        font-size: 16px;
        color: rgb(255, 255, 255);
        background-color: rgb(0, 0, 0);
        border: none;
        cursor: pointer;
        font-weight: bold;
        border-radius: 30px; 
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        white-space: nowrap;
        transition:
          transform 0.2s ease,
          background-color 0.2s;
        -webkit-tap-highlight-color: transparent; 
      }

      .view-btn:active {
        transform: translate(-50%, -50%) scale(0.95);
        background-color: #222;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>blurred content</h1>
    </header>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="640" height="480"></canvas>

    <div class="main-wrapper">
      <div class="content-container">
        <img
          src="https://picsum.photos/600/400"
          alt="Blurry Content"
          class="blurred-img"
          id="contentImage"
        />
        <button class="view-btn" id="viewBtn">View</button>
      </div>
    </div>

    <script src="../static/scipts2.js"></script>
  </body>
</html>
